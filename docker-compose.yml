services:
  record: &record
    tty: true
    stdin_open: true
    build: "."
    volumes:
      - type: bind
        source: ./logs
        target: /home/user/logs
    privileged: true
    ulimits:
      rtprio: 99
    environment: &envs
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      EXECUTOR: "${EXECUTOR:-single}"
      STRESS: "${STRESS:-true}"
    command: 
      - /bin/bash
      - -ec
      - |
        LOG_NAME=$${EXECUTOR:-single}_$${STRESS:-true}
        LOG_DIR=$${HOME}/logs/$${LOG_NAME}/$$(date +%Y%m%d%H%M%S)
        sudo mkdir -p $${LOG_DIR}
        sudo chown $${USER}:$${USER} $${LOG_DIR}
        . install/setup.bash
        . $$WORKDIR_CARET/install/local_setup.bash
        . install/local_setup.bash
        export LD_PRELOAD=$$(readlink -f $$WORKDIR_CARET/install/caret_trace/lib/libcaret.so)
        export ROS_TRACE_DIR=$${LOG_DIR}/caret
        echo "LOG_NAME=[$${LOG_NAME}]"
        echo "LOG_DIR=[$${LOG_DIR}]"
        echo "ROS_TRACE_DIR=[$${ROS_TRACE_DIR}]"
        ros2 launch sample_node trace_sample_node.launch.py stress:=${STRESS:-true} executor:=${EXECUTOR:-single} 
        sudo chmod 775 -R $${LOG_DIR}
        sudo chown $${USER}:$${USER} -R $${LOG_DIR}

  visualize: &visualize
    build: "."
    volumes:
      - type: bind
        source: ./logs
        target: /home/user/logs
      - type: bind
        source: ./caret_sample
        target: /home/user/caret_sample
    ports:
      - "8888:8888"
    environment: &envs
      CARET_LOG_NAME: ${CARET_LOG_NAME}
    command:
      - /bin/bash
      - -c
      - |
        . $$WORKDIR_CARET/install/local_setup.bash
        jupyter-lab --ip 0.0.0.0 --port 8888 --notebook-dir $${HOME}/caret_sample/jupyter

  visualize-to-html:
    <<: *visualize
    command: 
      - /bin/bash
      - -c
      - |
        . $$WORKDIR_CARET/install/local_setup.bash
        jupyter nbconvert --execute ~/caret_sample/jupyter/caret.ipynb --to html --output $$CARET_LOG_NAME
        jupyter nbconvert --execute ~/caret_sample/jupyter/caret.ipynb --to notebook --output $$CARET_LOG_NAME
